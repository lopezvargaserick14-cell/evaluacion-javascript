<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStock</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h2>TecnoStock</h2>
        <div>Carrito: <b id="totalUnidades">0</b></div>
    </header>

    <div class="filtros">
        <input type="text" id="buscador" placeholder="Buscar...">
        <select id="filtroCategoria">
            <option value="todas">Todas las categorías</option>
        </select>
        <select id="filtroOrden">
            <option value="">Ordenar</option>
            <option value="precio-menor">Menor precio</option>
            <option value="precio-mayor">Mayor precio</option>
            <option value="nombre-az">Nombre A-Z</option>
        </select>
        <label><input type="checkbox" id="checkDisponibles"> Solo disponibles</label>
        <button id="btnLimpiar">Limpiar</button>
    </div>

    <div id="mensajeEstado"></div>

    <main class="contenedor">
        <product-list id="lista-productos"></product-list>
        <shopping-cart id="carrito-compras"></shopping-cart>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
